import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins{
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id "com.modrinth.minotaur" version "2.+"
    id 'net.darkhax.curseforgegradle' version '1.1.26'
}

group = "pro.komaru"
version = "${version}"
base{
    archivesName = "Tridot"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories{
    mavenLocal()
    mavenCentral()
    maven { url = "https://maven.theillusivec4.top/" }
    maven { url = "https://cursemaven.com" }
    maven { url = "https://maven.blamejared.com" }
    maven{
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content{
            includeGroup "maven.modrinth"
        }
    }
}

sourceSets.main.resources{ srcDir 'src/generated/resources' }
neoForge{
    version = project.neo_version
    parchment{
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    accessTransformers{
        publish(project.file('src/main/resources/META-INF/accesstransformer.cfg'))
    }

    runs{
        configureEach{
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'tridot'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client{
            client()
        }

        server{
            server()
        }

        gameTestServer{
            type = 'gameTestServer'
        }

        data{
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', 'tridot', '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods{
        "tridot"{
            sourceSet sourceSets.main
        }
    }
}

dependencies{
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    compileOnly "maven.modrinth:iris:${iris_version}"
}

task apiJar(type: Jar) {
    archiveClassifier.set('api')
    from sourceSets.main.allSource
    from sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task sourcesJar(type: Jar) {
    archiveClassifier.set('sources')
    from sourceSets.main.allSource
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task javadocJar(type: Jar) {
    dependsOn javadoc
    from javadoc.destinationDir
    archiveClassifier.set('javadoc')
}

artifacts {
    archives sourcesJar
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_version            : version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
            artifact sourcesJar
            artifact apiJar
        }
    }

    repositories{
        maven{
            url "https://repo.komaru.studio/releases"
            credentials{
                username "admin"
                password System.getenv("maventoken")
            }
        }
    }
}

jar {
    manifest {
        attributes(["Specification-Title"     : project.name,
                    "Specification-Vendor"    : "IriDark, Auriny, Skoow",
                    "Specification-Version"   : 1,
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.version,
                    "Implementation-Vendor"   : "IriDark, Auriny, Skoow",
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")],)
    }
}

tasks.withType(JavaCompile).configureEach{
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '10000'])
}

task curseforge(type: TaskPublishCurseForge) {
    apiToken = System.getenv("cursetoken")
    def projectId = "1239146"
    def mainFile = upload(projectId, jar)
    mainFile.displayName = "Tridot-${version}"
    mainFile.releaseType = "release"
    mainFile.gameVersions = ["Server", "Client"]

    mainFile.addGameVersion("${minecraft_version}")
    mainFile.changelog = "API updates"
    mainFile.addModLoader("NeoForge")
    mainFile.addJavaVersion("Java 21")
}

modrinth {
    token = System.getenv("modrinthtoken")
    projectId = "tridot"
    versionNumber = "${version}";
    changelog = "API updates"
    versionType = "release"
    versionName = "${version}"
    uploadFile = tasks.jar
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
